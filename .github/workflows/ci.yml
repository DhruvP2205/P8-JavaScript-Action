name: "Build and test the tool"

on:
    push:
    workflow_dispatch:

jobs:
    build-and-test:
        runs-on: ubuntu-24.04
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            
            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: 24
                cache: "npm"
                cache-dependency-path: package-lock.json

            - name: Install Dependency
              run: npm ci

            - name: Npm Test
              run: npm test

            - name: NCC Builder
              run: npx ncc build src/index.js -o dist

            - name: "Check /dist changed or not"
              id: dist-check
              continue-on-error: true
              run: |
                if [ -n "$(git status --porcelain dist)" ]; then
                    echo "dist is out of date, rebuild and commit it"
                    git status --porcelain dist
                    exit 1
                fi

            - name: Upload Rebuild dist
              if: steps.dist-check.outcome == 'failure'
              uses: actions/upload-artifact@v7
              with:
                name: ncc-build
                path: dist/

            - name: Fail if dist was out of date
              if: steps.dist-check.outcome == 'failure'
              run: exit 1
