name: "Test JS Action"

on:
    push:
    workflow_dispatch:

jobs:
    test-action-workflow:
        name: ${{ matrix.name }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: stable
                      input: "1.2.3"
                      allow-prefix-v: "true"
                      fail-on-invalid: "true"
                      expected-outcome: success
                      expected-valid: "true"
                      expected-tags: "1.2.3,1.2"

                    - name: v prefix allowed
                      input: "v1.2.3"
                      allow-prefix-v: "true"
                      fail-on-invalid: "true"
                      expected-outcome: success
                      expected-valid: "true"
                      expected-tags: "1.2.3,1.2,1"

                    - name: v prefix not allowed
                      input: "v1.2.3"
                      allow-prefix-v: "false"
                      fail-on-invalid: "true"
                      expected-outcome: failure
                      expected-valid: "false"
                      expected-tags: ""

                    - name: prerelease
                      input: "1.0.0-rc.1"
                      allow-prefix-v: "true"
                      fail-on-invalid: "true"
                      expected-outcome: success
                      expected-valid: "true"
                      expected-tags: "1.0.0-rc.1"

                    - name: zero major
                      input: "0.4.2"
                      allow-prefix-v: "true"
                      fail-on-invalid: "true"
                      expected-outcome: success
                      expected-valid: "true"
                      expected-tags: "0.4.2,0.4"

                    - name: invalid but fail-on-invalid off
                      input: "1.2"
                      allow-prefix-v: "true"
                      fail-on-invalid: "false"
                      expected-outcome: success
                      expected-valid: "false"
                      expected-tags: ""

                    - name: invalid and fail-on-invalid on
                      input: "1.2"
                      allow-prefix-v: "true"
                      fail-on-invalid: "true"
                      expected-outcome: failure
                      expected-valid: "false"
                      expected-tags: "" 

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test Action
              id: action-test
              uses: ./
              continue-on-error: true
              with:
                version: ${{matrix.input}}
                allow-prefix-v: ${{matrix.allow-prefix-v}}
                fail-on-invalid: ${{matrix.fail-on-invalid}}

            - name: compare with expected result
              env:
                CASE_NAME: ${{ matrix.name }}
                EXPECTED_OUTCOME: ${{ matrix.expected-outcome }}
                EXPECTED_VALID: ${{ matrix.expected-valid }}
                EXPECTED_TAGS: ${{ matrix.expected-tags }}
                ACTUAL_OUTCOME: ${{ steps.action-test.outcome }}
                ACTUAL_VALID: ${{ steps.action-test.outputs.valid }}
                ACTUAL_TAGS: ${{ steps.action-test.outputs.docker-tags }}
              run: |
                failed=0

                if [ "$EXPECTED_OUTCOME" != "$ACTUAL_OUTCOME" ]; then
                    echo "outcome differs: expected '$EXPECTED_OUTCOME', got '$ACTUAL_OUTCOME'"
                    failed=1
                fi
                if [ "$EXPECTED_VALID" != "$ACTUAL_VALID" ]; then
                    echo "valid differs: expected '$EXPECTED_VALID', got '$ACTUAL_VALID'"
                    failed=1
                fi
                if [ "$EXPECTED_TAGS" != "$ACTUAL_TAGS" ]; then
                    echo "docker-tags differ: expected '$EXPECTED_TAGS', got '$ACTUAL_TAGS'"
                    failed=1
                fi

                if [ $failed -eq 1 ]; then
                    echo "$CASE_NAME : FAILED"
                    exit 1
                else
                    echo "$CASE_NAME : PASSED"
                fi
                
              