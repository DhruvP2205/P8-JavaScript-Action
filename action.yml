name: JavaScript Action
description: JavaScript Custom Action
branding:
  icon: 'activity'
  color: 'green'

inputs:
  version:
    description: "Docker Tag Version (Ex., 1.2.3 , v1.2.3 , 1.0.0-rc.1)"
    required: true

  allow-prefix-v:
    description: "If false, a leading v makes the version invalid"
    default: "true"

  fail-on-invalid:
    description: "If true, an invalid version turns the step red. If false, the step passes and only the output says valid=false"
    default: "true"

outputs:
  valid:
    description: "Version is valid or not"
  version:
    description: "Normalized version string without leading v and without build metadata"
  major:
    description: "Major version number"
  minor:
    description: "Minor version number"
  patch:
    description: "Patch version number"
  prerelease:
    description: "Prerelease identifier string (if any)"
  docker-tags:
    description: "Docker tags"

runs:
  using: node24
  main: dist/index.js